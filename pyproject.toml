[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "indextool"
dynamic = ["version"]
description = "Derive a deterministic architecture map from a Python repository, commit it, and fail CI when it is stale."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marc Cats" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/MarcCats/indextool"
Repository = "https://github.com/MarcCats/indextool"
Issues = "https://github.com/MarcCats/indextool/issues"
Changelog = "https://github.com/MarcCats/indextool/blob/main/CHANGELOG.md"

[project.scripts]
indextool = "indextool.cli:main"

[tool.hatch.version]
path = "src/indextool/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["docs/superpowers", ".superpowers"]

[tool.hatch.build.targets.wheel]
packages = ["src/indextool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
